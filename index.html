<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff3e3;overflow:hidden;touch-action:none}
body{font-family:'Galmuri11',sans-serif;color:#5a3d3d;word-break:keep-all;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage,#stage *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{touch-action:none}
#wrap{position:absolute;left:50%;top:0;transform-origin:top left}
#stage{position:relative;width:360px;height:640px;overflow:hidden;background:#fff3e3}
#cv{position:absolute;left:0;top:0;width:360px;height:640px;display:block}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.ov.on{display:flex}
#start{background:rgba(255,243,227,.94);justify-content:center}
.tag{font-size:13px;color:#4f8a72;background:#e3f6ee;border:2px solid #4f8a72;padding:4px 12px;border-radius:14px}
.ttl{font-size:34px;font-weight:700;margin:14px 0 6px;color:#5a3d3d;letter-spacing:-1px}
.sub{font-size:15px;color:#8a6f68;margin:0 0 18px;text-align:center;line-height:1.5}
.btn{font-family:inherit;font-weight:700;font-size:17px;height:52px;border-radius:14px;border:3px solid #5a3d3d;background:#6cc0a0;color:#fff;cursor:pointer;box-shadow:0 4px 0 #3d5c4f}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3d5c4f}
.btn.line{background:#fff;color:#5a3d3d;box-shadow:0 4px 0 #d9c4b4}
#go{width:260px}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:260px;margin-bottom:16px}
.rt{font-family:inherit;background:#fff;border:3px solid #e7d5c6;border-radius:12px;padding:8px 0 7px;color:#5a3d3d;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.rt b{font-weight:700;font-size:22px;line-height:1.1}
.rt span{font-size:12px;color:#a08a80}
.rt.on{border-color:#5a3d3d;background:#e3f6ee}
.rt.on span{color:#4f8a72}
.ttl{margin-top:10px!important}
.hint{font-size:12px;color:#a08a80;margin-top:14px}
.lumi-ft{--ft:#a08a80;padding:22px 18px 26px;text-align:center;font-family:sans-serif;font-size:12px;line-height:1.7;color:var(--ft)}
.lumi-ft a{color:inherit;font-weight:400;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}
#start .lumi-ft{position:absolute;bottom:0;left:0;right:0}
#result{touch-action:pan-y;background:#fff3e3;overflow-y:auto;justify-content:flex-start;padding-top:16px}
#card{width:316px;display:block}
.col{width:316px;margin-top:16px}
#save{width:100%;height:48px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;position:relative}
.row2 .btn{height:48px;font-size:16px;width:100%}
.toast{position:absolute;bottom:58px;background:#5a3d3d;color:#fff;font-size:13px;padding:6px 12px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.toast:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#5a3d3d}
.toast.on{opacity:1}
#savebox{background:rgba(90,61,61,.92);justify-content:center;gap:12px;color:#fff;font-size:16px}
#savebox p{margin:0}
#stage #saveimg{width:280px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#saveclose{width:140px;height:44px}
#snd{position:absolute;left:308px;top:590px;width:38px;height:38px;border:2px solid #5a3d3d;border-radius:8px;background:#fff;font-size:14px;line-height:1;color:#5a3d3d;display:none;cursor:pointer;padding:0;font-family:inherit}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="cv"></canvas>
<button id="snd" aria-label="소리 켜고 끄기">♪</button>
<div class="ov on" id="start">
  <div class="tag">루미 에어 승무원 모집</div>
  <div class="ttl">오늘도 무사 착륙</div>
  <p class="sub">승객들의 요청을 처리하고<br>도착까지 무사히 비행하세요</p>
  <div class="routes">
    <button class="rt on" data-r="NRT"><b>NRT</b><span>도쿄 · 입문</span></button>
    <button class="rt" data-r="BKK"><b>BKK</b><span>방콕 · 보통</span></button>
    <button class="rt" data-r="HNL"><b>HNL</b><span>하와이 · 어려움</span></button>
    <button class="rt" data-r="JFK"><b>JFK</b><span>뉴욕 · 지옥</span></button>

function buildBg(){

  const G=4,R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(RS(x*G),RS(y*G),RS((x+w)*G)-RS(x*G),RS((y+h)*G)-RS(y*G));};
  const inP=(x,y,P)=>{let s=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))s=!s;}return s;};
  const poly=(P,col)=>{for(let y=0;y<160;y++)for(let x=0;x<90;x++)if(inP(x+.5,y+.5,P))R(x,y,1,1,typeof col==='function'?col(x,y):col);};
  const ell=(cx,cy,rx,ry,col)=>{for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)R(x,y,1,1,col);}};

const aisle=py=>{const y=py/4,t=(y-54)/70;return[(42-9*t)*4,(48+9*t)*4];};

function makeSeats(){
  seats=[];
  ROWS.forEach(([bot,p,types],ri)=>{
    const[l,r]=aisle(bot),w=16*p,g=p,xs=[l-2*w-g,l-w-g,r+g,r+w+g];

const ALLITEMS={meal:'기내식',water:'물',coffee:'커피',bottle:'젖병',blanket:'담요',pillow:'베개',aid:'구급약',phones:'헤드폰'};

let AC=null,master,bgmG,muted=false,bgmOn=false,step=0,nextT=0,bgmTimer=null;
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
  bgmG=AC.createGain();bgmG.gain.value=.55;bgmG.connect(master);
}
function tone(f,t,d,type,v,dest){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05);}
function bell(f,t,d){tone(f,t,d,'sine',.28);tone(f*2,t,d*.6,'sine',.06);tone(f*3.01,t,d*.3,'sine',.02);}
function chime(){if(!AC)return;const t=AC.currentTime+.05;bell(830,t,1.8);bell(659,t+.6,2.4);}
function bing(){if(!AC)return;bell(830,AC.currentTime+.02,1.6);}
function sfx(k){if(!AC)return;const t=AC.currentTime;
  if(k==='ok'){tone(784,t,.12,'square',.07);tone(1175,t+.08,.18,'square',.07);}
  if(k==='no'){tone(196,t,.22,'square',.07);}
  if(k==='pick'){tone(660,t,.06,'triangle',.12);}
  if(k==='bad'){tone(392,t,.15,'square',.07);tone(262,t+.14,.3,'square',.07);}
  if(k==='pat'){tone(523,t,.1,'triangle',.15);}
  if(k==='cry'){[880,784,880,698].forEach((f,i)=>tone(f,t+i*.14,.16,'triangle',.12));}
  if(k==='star'){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.08,.2,'square',.06));}
}
const MEL=[72,76,79,76,74,77,81,77,72,76,79,84,83,79,76,74];
const MEL2=[72,75,79,75,74,77,80,77,72,75,79,84,82,79,75,74];
const BASS=[48,53,55,43];
const mf=m=>440*Math.pow(2,(m-69)/12);
let mode='calm';
const BPM={calm:108,busy:132,crisis:160};
function bgmTick(){
  if(!AC||!bgmOn)return;
  while(nextT<AC.currentTime+.12){
    const st=step%16,mel=mode==='crisis'?MEL2:MEL;
    tone(mf(mel[st]),nextT,.16,'square',.035,bgmG);
    if(st%4===0)tone(mf(BASS[(step>>4)%4]+(mode==='crisis'?0:0)),nextT,.3,'triangle',.09,bgmG);
    if(mode!=='calm'&&st%2===1)noise(nextT,mode==='crisis'?.035:.02);
    nextT+=60/BPM[mode]/2;step++;
  }
}
let nbuf=null;
function noise(t,v){if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);}const s=AC.createBufferSource(),g=AC.createGain();s.buffer=nbuf;g.gain.value=v;s.connect(g);g.connect(bgmG);s.start(t);}
function bgmStart(){if(!AC)return;bgmOn=true;step=0;nextT=AC.currentTime+.1;if(!bgmTimer)bgmTimer=setInterval(bgmTick,25);}
function bgmStop(){bgmOn=false;}

function makePlan(){
  const kinds=[];while(kinds.length<RT.minis){kinds.push(...['baby','bin','pour','meal'].sort(()=>Math.random()-.5));}
  const plan=[];for(let i=0;i<RT.minis;i++){let t=DUR*(i+.55)/(RT.minis+.2)+Math.random()*2;
    RT.turb.forEach(a=>{if(t>a-2&&t<a+TURB_LEN+1)t=a+TURB_LEN+1.5;});plan.push({k:kinds[i],t});}
  return plan.sort((a,b)=>a.t-b.t);
}

}
function startFlight(){DUR=RT.dur;FLIGHT_MIN=RT.fmin;setItems();newGame();phase='pre';chime();}
function patience(){return RT.pat[0]-(RT.pat[0]-RT.pat[1])*(G.t/DUR);}
function addReq(s,kind,max){s.req={kind,t:0,max:max||patience()};s.mood='';G.active++;}
function spawn(){
  const cands=seats.filter(s=>s.type&&!s.baby&&!s.req&&s.cool<=0);
  if(!cands.length||G.active>=RT.cap)return;
  if(G.tutLeft>0&&G.active>0)return;
  const baby=seats.find(s=>s.baby&&!s.req&&s.cool<=0&&s.mood!=='sleep');
  if(baby&&RT.items.includes('bottle')&&G.tutLeft<=0&&Math.random()<.22){addReq(baby,'bottle');return;}
  const s=cands[Math.floor(Math.random()*cands.length)];
  const bag=RT.items.filter(k=>k!=='bottle');
  addReq(s,bag[Math.floor(Math.random()*bag.length)],G.tutLeft>0?18:0);
  if(G.tutLeft>0)G.tutLeft--;
}
function beltReq(){
  const c=seats.filter(s=>s.type&&!s.baby&&!s.req);if(!c.length)return;
  addReq(c[Math.floor(Math.random()*c.length)],'belt',RT.easy?7:4.5);

function serve(item,s){
  if(!s||!s.type)return;
  if(!s.req){float(s.x+8*s.p,s.headTop-6,'괜찮아요','#a08a80');return;}
  if(s.req.kind==='belt'){float(s.x+8*s.p,s.headTop-6,'벨트부터요!','#ff6b7a');s.shake=.3;sfx('no');return;}
  if(item===s.req.kind){good(s,s.req.t<s.req.max*.5?2:1);}

function update(dt){
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(phase==='pre'){
    G.pre-=dt;
    if(G.pre<=0){phase='play';G.banner={text:'이륙! 쏟아지는 요청을 처리하세요',t:1.8};bgmStart();G.beltOff=1.6;}
    return;
  }
  if(phase!=='play')return;
  if(G.beltOff>0){G.beltOff-=dt;if(G.beltOff<=0&&G.turb<=0){G.belt=false;bing();}}
  G.crewY+=(G.crewTY-G.crewY)*Math.min(1,dt*5);
  if(G.crewHold>0){G.crewHold-=dt;if(G.crewHold<=0)G.crewTY=420;}
  seats.forEach(s=>{if(s.moodT>0){s.moodT-=dt;if(s.moodT<=0&&!s.req)s.mood='';}if(s.cool>0)s.cool-=dt;if(s.shake>0)s.shake-=dt;});
  G.floats.forEach(f=>f.t+=dt);G.floats=G.floats.filter(f=>f.t<1);
  if(G.mini){updMini(dt);mode='crisis';return;}
  G.t+=dt;
  if(G.plan.length&&G.t>=G.plan[0].t&&G.turb<=0){openMini(G.plan.shift().k);return;}
  if(G.turbs.length&&G.t>=G.turbs[0]&&G.turb<=0){G.turbs.shift();G.turb=TURB_LEN;G.belt=true;bing();G.banner={text:'난기류! 벨트 안 맨 승객을 탭하세요',t:2.6};for(let i=0;i<(RT.easy?2:3);i++)beltReq();G.beltNext=RT.beltGap;}
  const T=G.turb>0;
  if(T){G.turb-=dt;G.beltNext-=dt;if(G.beltNext<=0){beltReq();G.beltNext=RT.beltGap*(.85+Math.random()*.4);}
    if(G.turb<=0){G.belt=false;bing();G.banner={text:'기류가 안정됐어요',t:1.4};}}
  G.nextSpawn-=dt;
  if(G.nextSpawn<=0){spawn();if(G.tutLeft<=0&&Math.random()<RT.dbl*(T?1.4:1))spawn();G.nextSpawn=(RT.sp-.35*RT.sp*(G.t/DUR))*(T?.8:1)+Math.random()*.4;}
  let urgent=false;
  seats.forEach(s=>{if(!s.req)return;s.req.t+=dt*(T?RT.tmul:1);const r=s.req.t/s.req.max;
    s.mood=r>.6?'angry':'';if(r>.6)urgent=true;
    if(r>=1){const x=s.x+8*s.p,y=s.headTop-6;clearReq(s);complain(s,x,y);}
  });
  mode=(T||urgent)?'crisis':G.active>=3?'busy':'calm';
  if(G.t>=DUR&&!G.ended)endGame(true);
}

  if(G&&G.drag&&Math.hypot(G.drag.x-G.drag.sx,G.drag.y-G.drag.sy)>12){spr(ctx,ICON[G.drag.item],ICONPAL,G.drag.x-14,G.drag.y-58,4);}
  if(G&&G.mini)drawMini();
}

function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(G)update(dt);draw();requestAnimationFrame(loop);}
