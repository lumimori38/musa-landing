<script>
(()=>{
const W=360,H=640,OL='#5a3d3d',FONT="'Jua',sans-serif";

const wrap=document.getElementById('wrap');

function spr(c,rows,pal,x,y,s){
  for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.')continue;const col=pal[ch];if(!col)continue;c.fillStyle=col;const x0=RS(x+i*s),y0=RS(y+j*s);c.fillRect(x0,y0,RS(x+(i+1)*s)-x0,RS(y+(j+1)*s)-y0);}}
}
const EARS={cat:[".kk......kk.","kiok....koik"],bear:[".kkk....kkk.","kiik....kiik"],rabbit:["..kk....kk..",".kiok..koik.",".kiok..koik.",".kiok..koik."],pig:["............","kiik....kiik"],chick:[".....kk.....","....k..k...."],dog:[".kkk....kkk.","kddk....kddk"]};
const FACE=[".kkkkkkkkkk.","kooooooooook","kooooooooook","kooeooooeook","kooeooooeook","kpowwnnwwopk","koowwwwwwook",".kooooooook.","..kkkkkkkk.."];
const BODY=["..kssssssk..",".kssssssssk.","kssssssssssk"];
const cache={};
function animal(type,mood){
  const key=type+mood;if(cache[key])return cache[key];
  let f=FACE.slice();
  if(type==='chick'||type==='pig')f=f.map(r=>r.replace(/w/g,'o'));
  if(type==='chick'){f[5]="kpooonnooopk";f[6]="koooonnooook";}
  const set=(row,i,ch)=>{f[row]=f[row].slice(0,i)+ch+f[row].slice(i+1);};
  if(mood==='cry'){set(5,3,'t');set(5,8,'t');set(6,3,'t');set(6,8,'t');set(7,3,'t');set(7,8,'t');}
  if(mood==='angry'){f[2]="kokkooookkok";}
  if(mood==='happy'||mood==='sleep'){f[3]="kooooooooook";f[4]="koekeookekok";}
  return cache[key]=[...EARS[type],...f,...BODY];
}
const SPEC={cat:{o:'#f2a65a',i:'#ffd2b0',w:'#fff4e6'},bear:{o:'#9a6a45',i:'#d9a77c',w:'#e9c9a6'},rabbit:{o:'#f4f1ee',i:'#f7b8c8',w:'#ffffff'},pig:{o:'#f7b6c2',i:'#e98ea2',w:'#f7b6c2',n:'#d9708a'},chick:{o:'#ffd84d',i:'#ffd84d',n:'#ff8a3d'},dog:{o:'#e8d2b0',i:'#e8d2b0',d:'#8a5a3b',w:'#fff8ee'}};
const palCache={};
function pal(type,shirt){const k=type+shirt;return palCache[k]||(palCache[k]=Object.assign({k:OL,e:OL,p:'#ff9aa8',n:'#5a3a3a',t:'#5ec8ff',s:shirt},SPEC[type]));}
const mixC=(a,b,t)=>{const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};
function angryPal(type,shirt){const k='A'+type+shirt;if(palCache[k])return palCache[k];const b=pal(type,shirt),o=Object.assign({},b);['o','w','i'].forEach(c=>{if(b[c])o[c]=mixC(b[c],'#ff6b6b',.38);});o.p='#ff4a5a';return palCache[k]=o;}
const ICON={
 meal:[".g.g.g.","g.g.g..",".......","kkkkkkk","kwwwwwk","kwwwwwk",".kwwwk.","..kkk.."],

 bottle:["...k...","..kpk..",".kwwwk.",".kwbwk.",".kwwwk.",".kwbwk.",".kkkkk."],
 blanket:["kkkkkkk","krrrrrk","kyyyyyk","krrrrrk","kyyyyyk","kkkkkkk"],
 aid:["kkkkkkk","kwwrwwk","kwrrrwk","kwwrwwk","kkkkkkk"],
 phones:[".kkkkk.","k.....k","k.....k","vk...kv","vk...kv","vk...kv"],
 belt:[".......","hhkkkhh","hkyyykh","hhkkkhh","......."],
 beef:[".......","..kkk..",".kmmmk.","kmmqmmk","kmmmmmk",".kkkkk."],
 chicken:["..kkkk.",".kqqqqk","kqqqqqk","kqqqqk.",".kkkk..","kwk...."],
 bibim:[".r.y.e.","kkkkkkk","kwwwwwk",".kwwwk.","..kkk.."],
 bag:[".kkkkk.",".k...k.","kkkkkkk","kvvvvvk","kvyvvvk","kvvvvvk","kkkkkkk"]
};
const ICONPAL={k:OL,w:'#ffffff',g:'#b9b9c8',b:'#7fd3ff',p:'#ff9aa8',r:'#ff6b7a',y:'#ffd84d',v:'#c9b6ff',m:'#b5653a',q:'#f3b37a',e:'#7cc96a',h:'#8f7f96'};
const ANGER=[".r.r.","rr.rr",".....","rr.rr",".r.r."];
const SEAT=["..kkkkkkkkkkkk..",".kwwwwwwwwwwwwk.",".kwwwwwwwwwwwwk.",".kbbbbbbbbbbbbk.",".kbllllllllllbk.",".kbllllllllllbk.",".kbllllllllllbk.",".kbllllllllllbk.",".kbllllllllllbk.","kkbllllllllllbkk","kakbbbbbbbbbbkak","kakcccccccccckak","kakcccccccccckak","kkkkkkkkkkkkkkkk"];
const SEATPAL={k:'#3d5c4f',w:'#ffffff',b:'#6cc0a0',l:'#8fdcbc',a:'#4f8a72',c:'#7fd0b0'};
const CREW=[...EARS.cat,...FACE.map((r,i)=>i===3?"kooooooooook":i===4?"koekeookekok":r),"..kuurruuk..",".kuuurruuuk.","kfkuuuuuukfk","kfkuuyyuukfk",".k.kuuuuk.k.","...kssssk...","...kffffk...","...kk..kk..."];
const CREWPAL=Object.assign({},pal('cat','#fff'),{u:'#5b7cfa',r:'#ff7a8a',y:'#ffffff',s:'#4363d8',f:'#f2a65a'});

let bg;
function buildBg(){
  bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
  const c=bg.getContext('2d');c.setTransform(S,0,0,S,0,0);
  const G=4,R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(RS(x*G),RS(y*G),RS((x+w)*G)-RS(x*G),RS((y+h)*G)-RS(y*G));};
  const inP=(x,y,P)=>{let s=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))s=!s;}return s;};
  const poly=(P,col)=>{for(let y=0;y<160;y++)for(let x=0;x<90;x++)if(inP(x+.5,y+.5,P))R(x,y,1,1,typeof col==='function'?col(x,y):col);};
  const ell=(cx,cy,rx,ry,col)=>{for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)R(x,y,1,1,col);}};
  R(0,0,90,160,'#fff3e3');
  // ceiling
  poly([[0,18],[90,18],[55,38],[35,38]],'#f8ecf2');
  for(let y=20;y<38;y+=3)R(44,y,2,1,'#ffffff');
  // bins
  poly([[0,18],[35,38],[35,44],[0,35]],(x,y)=>{const seg=[0,10,19,26,31,35].findIndex(v=>v>x);return [9,18,25,30,34].includes(x)?'#e3d2da':'#ffffff';});
  poly([[90,18],[55,38],[55,44],[90,35]],(x,y)=>[80,71,64,59,55].includes(x)?'#e3d2da':'#ffffff');
  for(let x=0;x<35;x++){const y=Math.round(35+9*x/35);R(x,y,1,1,'#d9b9c6');R(89-x,y,1,1,'#d9b9c6');}
  [[4,0.5],[14,0.5],[22,0.4],[28,0.3]].forEach(([x])=>{const y=Math.round(35+9*x/35)-2;R(x,y,3,1,'#c7a9b6');R(87-x,y,3,1,'#c7a9b6');});
  // walls
  poly([[0,35],[35,44],[35,54],[0,118]],'#ffe9c9');poly([[90,35],[55,44],[55,54],[90,118]],'#ffe9c9');
  [[6,58,4,6],[17,55,2.8,4.2],[25,53,2,3],[31,51.5,1.2,1.8]].forEach(([x,y,rx,ry])=>{[x,90-x].forEach(X=>{ell(X,y,rx+1,ry+1,'#e3bfa0');ell(X,y,rx,ry,'#bfe6f5');if(rx>2)R(Math.round(X-rx*.4),Math.round(y+ry*.2),Math.max(1,Math.round(rx*.8)),1,'#ffffff');});});
  // back wall
  R(35,38,20,16,'#f6dcc0');R(38,41,14,13,'#9ad7ff');R(38,41,14,1,'#ffffff');R(44,42,2,12,'#7fc4ee');
  // floor stripes
  poly([[35,54],[55,54],[90,118],[90,124],[0,124],[0,118]],(x,y)=>{const t=(y-54)/70;return Math.floor(Math.pow(t,.7)*8)%2?'#ffdcb4':'#ffe9c9';});
  poly([[42,54],[48,54],[57,124],[33,124]],(x,y)=>((x===44||x===45)&&(Math.floor(y/3)%2))?'#ff9f9f':'#ffc4c4');
  // galley
  R(0,123,90,37,'#6cc0a0');R(0,123,90,1,OL);R(0,124,90,14,'#fff7ec');R(0,138,90,1,OL);R(0,139,90,2,'#ffb3c7');
  for(let i=0;i<6;i++)R(i*15+3,135,9,2,'#ead8c2');
  // HUD
  R(0,0,90,17,'#ffffff');R(0,17,90,1,OL);
  R(62,1,27,15,OL);R(63,2,25,13,'#ffffff');
}

const aisle=py=>{const y=py/4,t=(y-54)/70;return[(42-9*t)*4,(48+9*t)*4];};
const ROWS=[[232,2,['cat',null,'bear','dog']],[298,2.5,['pig','rabbit',null,'dog']],[374,3,['bear','cat','chick','pig']],[462,3.5,['rabbit',null,'bear','cat']]];
const SHIRTS=['#ffb3c7','#9ad7ff','#ffe08a','#c9b6ff','#a8e6b8'];
let seats=[];
function makeSeats(){
  seats=[];
  ROWS.forEach(([bot,p,types],ri)=>{
    const[l,r]=aisle(bot),w=16*p,g=p,xs=[l-2*w-g,l-w-g,r+g,r+w+g];
    types.forEach((t,ci)=>{
      const top=bot-14*p;
      const s={ri,ci,p,x:xs[ci],bot,top,type:t,shirt:SHIRTS[(ri+ci)%5],req:null,mood:'',moodT:0,cool:0,shake:0,baby:t==='chick'};
      if(t){const ex=EARS[t].length;s.py=top-(ex-1)*p;s.headTop=s.py;}
      seats.push(s);
    });
  });
}
const ITEMS=[['meal','기내식'],['water','물'],['bottle','젖병'],['blanket','담요'],['aid','구급약'],['phones','헤드폰']];

let AC=null,master,bgmG,muted=false,bgmOn=false,step=0,nextT=0,bgmTimer=null;
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
  bgmG=AC.createGain();bgmG.gain.value=.55;bgmG.connect(master);
}
function tone(f,t,d,type,v,dest){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05);}
function bell(f,t,d){tone(f,t,d,'sine',.28);tone(f*2,t,d*.6,'sine',.06);tone(f*3.01,t,d*.3,'sine',.02);}
function chime(){if(!AC)return;const t=AC.currentTime+.05;bell(830,t,1.8);bell(659,t+.6,2.4);}
function bing(){if(!AC)return;bell(830,AC.currentTime+.02,1.6);}
function sfx(k){if(!AC)return;const t=AC.currentTime;
  if(k==='ok'){tone(784,t,.12,'square',.07);tone(1175,t+.08,.18,'square',.07);}
  if(k==='no'){tone(196,t,.22,'square',.07);}
  if(k==='pick'){tone(660,t,.06,'triangle',.12);}
  if(k==='bad'){tone(392,t,.15,'square',.07);tone(262,t+.14,.3,'square',.07);}
  if(k==='pat'){tone(523,t,.1,'triangle',.15);}
  if(k==='cry'){[880,784,880,698].forEach((f,i)=>tone(f,t+i*.14,.16,'triangle',.12));}
  if(k==='star'){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.08,.2,'square',.06));}

function bgmTick(){

    RT.turb.forEach(a=>{if(t>a-2&&t<a+TURB_LEN+1)t=a+TURB_LEN+1.5;});plan.push({k:kinds[i],t});}

  if(k==='meal'){const ps=[];const pool=adults.slice().sort(()=>Math.random()-.5);for(let i=0;i<3;i++)ps.push({s:pool[i],o:pick(MEALS)[0]});Object.assign(m,{title:'기내식 주문!',sub:'주문을 기억했다가 순서대로 고르세요',max:6.5,show:1.8,ps,idx:0});sfx('pick');}

function miniRelease(){const m=G.mini;if(!m||m.done||m.k!=='pour'||!m.hold)return;m.hold=false;if(m.fill>=m.lo&&m.fill<=m.hi)finishMini(true,'딱 맞췄어요! +3');else finishMini(false,m.fill<m.lo?'너무 적어요…':'너무 많아요…');}
function updMini(dt){
  const m=G.mini;
  if(m.done){m.done-=dt;if(m.done<=0)G.mini=null;return;}
  m.t+=dt;m.flash=m.flash>0?Math.max(0,m.flash-dt):Math.min(0,m.flash+dt);
  if(m.k==='baby'){m.pos+=m.dir*m.speed*dt;if(m.pos>1){m.pos=1;m.dir=-1;}if(m.pos<0){m.pos=0;m.dir=1;}}
  if(m.k==='pour'&&m.hold){m.fill+=dt*.5;if(Math.floor(m.fill*20)!==Math.floor((m.fill-dt*.5)*20))tone(300+m.fill*500,AC?AC.currentTime:0,.05,'triangle',.05);if(m.fill>=1){m.fill=1;m.hold=false;m.spill=true;finishMini(false,'넘쳤어요! 바지가 흠뻑…');return;}}

function update(dt){
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(phase==='pre'){
    G.pre-=dt;
    if(G.pre<=0){phase='play';G.banner={text:'이륙! 쏟아지는 요청을 처리하세요',t:1.8};bgmStart();G.beltOff=1.6;}
    return;
  }
  if(phase!=='play')return;
  if(G.beltOff>0){G.beltOff-=dt;if(G.beltOff<=0&&G.turb<=0){G.belt=false;bing();}}
  G.crewY+=(G.crewTY-G.crewY)*Math.min(1,dt*5);
  if(G.crewHold>0){G.crewHold-=dt;if(G.crewHold<=0)G.crewTY=420;}
  seats.forEach(s=>{if(s.moodT>0){s.moodT-=dt;if(s.moodT<=0&&!s.req)s.mood='';}if(s.cool>0)s.cool-=dt;if(s.shake>0)s.shake-=dt;});
  G.floats.forEach(f=>f.t+=dt);G.floats=G.floats.filter(f=>f.t<1);
  if(G.mini){updMini(dt);mode='crisis';return;}
  G.t+=dt;
  // minigame plan
  if(G.plan.length&&G.t>=G.plan[0].t&&G.turb<=0){openMini(G.plan.shift().k);return;}
  // turbulence = rush
  if(G.turbs.length&&G.t>=G.turbs[0]&&G.turb<=0){G.turbs.shift();G.turb=TURB_LEN;G.belt=true;bing();G.banner={text:'난기류! 벨트 안 맨 승객을 탭하세요',t:2.6};for(let i=0;i<3;i++)beltReq();G.beltNext=1.2;}
  const T=G.turb>0;
  if(T){G.turb-=dt;G.beltNext-=dt;if(G.beltNext<=0){beltReq();G.beltNext=.9+Math.random()*.6;}
    if(G.turb<=0){G.belt=false;bing();G.banner={text:'기류가 안정됐어요',t:1.4};}}
  // spawn
  G.nextSpawn-=dt;
  if(G.nextSpawn<=0){spawn();if(Math.random()<(T?.55:.4))spawn();G.nextSpawn=(RT.sp-.6*(G.t/DUR))*(T?.75:1)+Math.random()*.4;}
  // patience
  let urgent=false;
  seats.forEach(s=>{if(!s.req)return;s.req.t+=dt*(T?1.35:1);const r=s.req.t/s.req.max;
    s.mood=r>.6?'angry':'';if(r>.6)urgent=true;
    if(r>=1){const x=s.x+8*s.p,y=s.headTop-6;clearReq(s);complain(s,x,y);}
  });
  mode=(T||urgent)?'crisis':G.active>=3?'busy':'calm';
  if(G.t>=DUR&&!G.ended)endGame(true);
}

function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function seatAt(x,y){
  for(let i=seats.length-1;i>=0;i--){const s=seats[i];if(!s.type)continue;
    let x0=s.x,x1=s.x+16*s.p,y0=s.headTop-(s.req?15*Math.max(s.p,3)+4:0),y1=s.bot;
    const cx=(x0+x1)/2;if(x1-x0<44){x0=cx-22;x1=cx+22;}
    if(x>=x0&&x<=x1&&y>=y0&&y<=y1)return s;}
  return null;
}
function itemAt(x,y){if(y<494||y>584)return null;return ITEMS[Math.min(5,Math.floor(x/60))][0];}
cv.addEventListener('pointerdown',e=>{
  if(phase!=='play')return;e.preventDefault();
  const p=pt(e);
  if(G.mini){miniTap(p);return;}
  const it=itemAt(p.x,p.y);
  if(it){G.drag={item:it,x:p.x,y:p.y,sx:p.x,sy:p.y};G.sel=null;sfx('pick');try{cv.setPointerCapture(e.pointerId);}catch(_){}return;}
  const s=seatAt(p.x,p.y);
  if(s&&s.req&&s.req.kind==='belt'){good(s,1);return;}
  if(s){if(G.sel){serve(G.sel,s);G.sel=null;return;}if(s.req){s.shake=.2;float(s.x+8*s.p,s.headTop-6,'아이템을 끌어다 주세요','#8a6f68');}}
  else G.sel=null;
});
cv.addEventListener('pointermove',e=>{if(G&&G.drag){const p=pt(e);G.drag.x=p.x;G.drag.y=p.y;}});
cv.addEventListener('pointerup',e=>{
  if(G&&G.mini){miniRelease();return;}
  if(!G||!G.drag)return;const d=G.drag;G.drag=null;
  if(Math.hypot(d.x-d.sx,d.y-d.sy)<=12){G.sel=d.item;return;}
  const s=seatAt(d.x,d.y-42);if(s)serve(d.item,s);
});
cv.addEventListener('pointercancel',()=>{if(G){G.drag=null;if(G.mini)miniRelease();}});

  B(0,0,14,12,OL);
  for(let j=1;j<11;j++)for(let i=1;i<13;i++){const edge=i===1||i===12||j===1||j===10;B(i,j,1,1,edge?(((i+j)>>1)%2?'#3a2a2a':'#ffd84d'):'#ffd84d');}

  B(5,12,4,1,OL);B(6,13,2,1,OL);
  const left=1-ratio;rect(x+p,y-p*1.6,12*p,p*.9,'#efe2d6');rect(x+p,y-p*1.6,12*p*left,p*.9,left>.5?'#6cc0a0':left>.25?'#ffb020':'#ff4a5a');
}
function bubble(x,y,p,kind,ratio,urgent,shake){

  x+=shake>0?Math.round(Math.sin(shake*60)*3):0;
  const ol=urgent?'#ff4a5a':OL,bgc=urgent?'#fff1f1':'#ffffff';
  const B=(a,b,w,h,col)=>rect(x+a*p,y+b*p,w*p,h*p,col);
  B(1,0,12,1,ol);B(1,11,12,1,ol);B(0,1,1,10,ol);B(13,1,1,10,ol);B(1,1,12,10,bgc);B(5,12,3,1,ol);B(6,13,1,1,ol);B(5,11,3,1,bgc);
  spr(ctx,ICON[kind],ICONPAL,x+3.5*p,y+(kind==='belt'?3:2)*p,p);
  const left=1-ratio;rect(x+p,y-p*1.6,12*p,p*.9,'#efe2d6');rect(x+p,y-p*1.6,12*p*left,p*.9,left>.5?'#6cc0a0':left>.25?'#ffb020':'#ff4a5a');
}

function drawMini(){
